name: Lantern package CI

on:
  push:
    branches:
      - "work/lantern-truthful-package-v1-20260919"
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy
      - name: Build wheel and sdist
        run: python -m build
      - name: Smoke import and CLI
        run: |
          python - <<'PY'
          import lantern
          assert hasattr(lantern, "LanternStore")
          assert hasattr(lantern, "RecordEnvelope")
          PY
          lantern --help >/dev/null
      - name: Diff check
        run: git diff --check
