[project]
name = "build-team-2"
version = "0.1.0"
description = "A ten-facet software build collective with one shared hivemind."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-agents==0.19.3",
  "pydantic>=2.10,<3",
  "supabase>=2.15,<3",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
build-team = "build_team.cli:app"
lantern = "lantern.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/build_team", "src/lantern"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["build_team"]
